<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rank privacy layout fixture</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../phase3-v205.css?v=alpha3.2">
<body><div id="overlay-root"><div class="rank-burst v205-rank-privacy-burst">
  <div class="rank-burst-rings"></div>
  <div class="rank-burst-copy"><div class="rank-burst-kicker">RANK POSITION</div><div class="rank-burst-rank">1<span>st</span></div><div class="rank-burst-score">1,650 pts</div></div>
  <section class="v205-rank-privacy-panel" aria-label="ランキング公開設定">
    <h2>この記録を公開しますか？</h2>
    <p class="v205-publication-copy">自己ベストを更新しました。公開しなくても順位相当は自分に表示されます。</p>
    <div class="v205-publication-positions"><div><span>月間</span><strong>1位相当</strong></div><div><span>殿堂</span><strong>2位相当</strong></div></div>
    <p class="v205-publication-note">公開されるのはプレイヤー名・コースバッジ・アバター・称号・フレーム・スコア・正答率・最大コンボです。学籍番号は公開されません。</p>
    <div class="v205-publication-actions"><button type="button" class="secondary-btn">非公開のまま続ける</button><button type="button" class="primary-btn">このランキングを公開する</button></div>
  </section>
</div></div></body></html>
