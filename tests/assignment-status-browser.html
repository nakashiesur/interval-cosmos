<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課題ボタンの確認</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../phase6-assignments-v205.css"><link rel="stylesheet" href="../phase10-ui-foundation-v205.css"><link rel="stylesheet" href="../assignment-status-v205.css">
<style>body{padding:32px 18px;color:#edf4ff;overflow:auto}.home-screen{max-width:700px;margin:30px auto}h1{font-size:24px}p{color:#a4b8d4;font-size:13px;line-height:1.9}.home-footer{padding:24px 0}select{padding:12px;background:#14223c;color:#fff;border:1px solid #526482;border-radius:10px}.examples{display:grid;gap:20px;margin:30px auto;max-width:700px}.example{background:#10182a;border:1px solid #25334c;border-radius:16px;padding:20px}.example h2{font-size:14px;color:#cbd7ec}.example button{width:230px;max-width:100%}</style>
<main class="home-screen"><p>INTERVAL COSMOS / ASSIGNMENTS</p><h1>先生からの課題を、ひと目で。</h1><p>未完了はローズ色と件数、全クリアはミント色のチェック。<br>受付前・期限終了・オフラインも区別します。</p><label>状態を切り替える <select id="fixture"><option value="pending">未回答の課題あり</option><option value="attempted">挑戦済み・未クリア</option><option value="complete">すべてクリア</option><option value="empty">課題なし</option><option value="upcoming">受付前</option><option value="closed">期限終了</option><option value="error">通信エラー</option><option value="admin">管理者</option></select></label>
<footer class="home-footer home-footer-rich"><button type="button" class="secondary-btn v205-assignment-launch" data-a-open>ASSIGNMENTS</button><button class="secondary-btn">INSTRUCTIONS</button><button class="secondary-btn">SETTINGS</button></footer><div id="gallery" class="examples"></div></main>
<script>
let profile={id:'preview-student',is_admin:false},fixture='pending';
const sample=(x={})=>({id:'example',start_at:new Date(Date.now()-100000).toISOString(),deadline_at:new Date(Date.now()+86400000).toISOString(),attempts:0,achieved:false,...x});
const fixtureRows=()=>({pending:[sample(),sample({attempts:2})],attempted:[sample({attempts:2})],complete:[sample({achieved:true})],empty:[],upcoming:[sample({start_at:new Date(Date.now()+400000).toISOString()})],closed:[sample({deadline_at:new Date(Date.now()-1000).toISOString()})]})[fixture]||[];
window.IntervalCosmosCloud={getCachedPlayer:()=>profile,init:async()=>{}};window.IntervalCosmosSupabaseSingleton={getClient:()=>({rpc:async()=>({data:fixtureRows(),error:fixture==='error'?new Error('preview'):null})})};
</script><script src="../phase6-admin-policy-v205.js"></script><script src="../assignment-status-v205.js"></script><script>
document.querySelector('#fixture').onchange=async e=>{fixture=e.target.value;profile={id:fixture==='admin'?'admin':'preview-student',is_admin:fixture==='admin'};await IntervalCosmosAssignmentStatusV205.refresh(true);if(fixture==='admin')IntervalCosmosAssignmentAdminPolicyV205.applyAdminVisualState()};
</script></html>
