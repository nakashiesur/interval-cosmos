<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>承認済みフレーム・ゲーム表示検証</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../phase3-v205.css"><link rel="stylesheet" href="../phase5-v205.css"><link rel="stylesheet" href="../phase10-cosmos-polish-v205.css"><link rel="stylesheet" href="../phase11-frames-v205.css?v=art1">
<style>body{overflow:auto;padding:24px;background:#071421;color:white}main{max-width:800px;margin:auto}.samples{display:flex;gap:45px;align-items:center;flex-wrap:wrap;padding:24px}.v205-frame-card{width:160px}h1{font-size:24px}h2{font-size:18px}.v205-profile-avatar{width:84px;height:84px;font-size:36px}section{margin:24px 0;border:1px solid #345;padding:16px}</style>
<main><h1>ゲーム用フレームの表示確認</h1><p>本体と同じ画像・スタイルで表示。アカウントや記録は変更しません。</p><div id="samples"></div></main><script>
for(const [id,name] of [['supernova','スーパーノヴァ'],['event_horizon','事象の地平面']]){document.querySelector('#samples').insertAdjacentHTML('beforeend',`<section><h2>${name}</h2><div class="samples"><div><p>MY COSMOS</p><div class="v205-cosmos-avatar v205-frame-${id}">✦</div></div><div><p>プロフィール</p><div class="v205-profile-avatar v205-profile-frame v205-frame-${id}">✦</div></div><div><p>ランキング</p><div class="rank-avatar v205-profile-frame v205-frame-${id}">✦</div></div></div><div class="samples"><button class="v205-frame-card animated v205-frame-${id}"><span class="v205-frame-orb">✦</span><strong>解放済み</strong></button><button disabled class="v205-frame-card animated locked v205-frame-${id}"><span class="v205-frame-orb">?</span><strong>未解放・静止</strong></button></div></section>`)}
</script></html>
