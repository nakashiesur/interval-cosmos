<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム用アイコン一覧</title><link rel="stylesheet" href="../phase11-art-v205.css"><style>body{background:#071421;color:#eef6ff;font-family:system-ui;margin:24px auto;padding:0 20px;max-width:1100px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.tile{padding:15px;background:#0e1e32;border:1px solid #304559;border-radius:12px;text-align:center}.tile img{width:80px;height:80px;margin:0 auto 10px;display:block}.tile small{display:block;color:#b6c8dd;margin-top:5px}</style><h1>ゲーム用アイコン・コースバッジ</h1><p>承認されたモチーフを、小さくても鮮明な個別ベクター画像に仕上げた実装版です。</p><h2>プレイヤー24種類＋教員</h2><div class="grid" id="avatars"></div><h2>コースバッジ</h2><div class="grid" id="courses"></div><script src="../phase11-art-v205.js"></script><script>const a=window.IntervalCosmosArt;for(const id of a.avatars)document.querySelector('#avatars').insertAdjacentHTML('beforeend',`<div class="tile"><img src="../assets/art/v1/avatars/${id}.svg" alt="">${id.toUpperCase()}<small>${a.avatarLabel(id)}</small></div>`);const labels=['ピアノ','管弦打楽','声楽・ミュージカル','作曲','ロック＆ポップス','電子オルガン','サウンドデザイン','音楽教育','音楽療法','こども文化','声優'];a.courses.forEach((id,i)=>document.querySelector('#courses').insertAdjacentHTML('beforeend',`<div class="tile"><img src="../assets/art/v1/courses/${id}.svg" alt="">${labels[i]}</div>`));</script></html>
