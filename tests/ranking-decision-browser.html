<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公開確認の再表示テスト</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../phase3-v205.css"><style>body{padding:24px;overflow:auto;color:white}button{margin:8px;padding:14px}#status{padding:16px}</style><h1>公開確認の再表示テスト</h1><p>架空データのみ。外部への送信はありません。</p><button id="start">確認を開く</button><button id="timer">遅れていた確認処理を実行</button><label><input id="slow" type="checkbox">公開通信を10秒遅らせる</label><label><input id="fail" type="checkbox">公開通信を失敗させる</label><p id="status" role="status">待機中</p><div class="result-panel"></div><div id="overlay-root"></div><script>
const originalTimeout=window.setTimeout.bind(window);let fallback;let count=0;
window.setTimeout=(fn,ms,...args)=>ms===2300?(fallback=fn,0):originalTimeout(fn,ms,...args);
window.IntervalCosmosCloud={configured:()=>false,getCachedPlayer:()=>({ranking_visibility:'ask'}),submitScore:async()=>({session_id:'fixture-'+(++count),publication_required:true,monthly_rank:1,hall_rank:2,monthly_best_improved:true}),publishPlaySession:async()=>{if(document.querySelector('#slow').checked)await new Promise(resolve=>originalTimeout(resolve,10000));if(document.querySelector('#fail').checked)throw new Error('テスト用通信エラー');return {monthly_rank:1,hall_rank:2}}};
</script><script src="../phase3-v205.js?v=alpha3.9"></script><script>
start.onclick=async()=>{const result=await IntervalCosmosCloud.submitScore({});const node=document.createElement('div');node.className='rank-burst';document.querySelector('#overlay-root').append(node);IntervalCosmosRankingPrivacy.mountBurst(node,result);document.querySelector('#status').textContent='公開または非公開を選んでから、遅れていた確認処理を実行してください';};
document.querySelector('#timer').onclick=()=>{fallback?.();document.querySelector('#status').textContent=document.querySelector('.v205-publication-overlay,.v205-rank-privacy-burst')?'FAIL：確認が再表示されました':'PASS：選択済みの確認は再表示されません';};
</script></html>
