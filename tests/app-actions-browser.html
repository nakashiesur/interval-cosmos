<!doctype html><html lang="ja"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ランキング管理・アプリ追加の確認</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app-actions-v205.css"><style>body{display:block;padding:20px;overflow:auto}.settings-modal{position:static;display:block;background:none;backdrop-filter:none;margin-top:30px}.ranking-list{margin-top:20px}.modal-card{width:auto}</style><body><button id="toggle">管理者モード ON/OFF</button><button id="hold">長押し操作を再現</button><p id="result"></p><div class="ranking-list"><div class="ranking-row"><span>1</span><div class="rank-avatar"></div><div class="rank-player"><strong>架空プレイヤー</strong></div><div class="rank-score">9000</div></div></div><div class="settings-modal"><section class="modal-card"><h2>設定</h2></section></div><script>
let admin=true;const player={is_admin:true};
window.IntervalCosmosCloud={getCachedPlayer:()=>player,fetchRankings:async()=>({rows:[{rank:1,player_id:'fixture',player_name:'架空プレイヤー',score:9000,updated_at:'2026-09-29T12:00:00Z'}],period:'ALL'})};

</script><script src="phase3-v205.js?v=beta.1.11"></script><script src="ranking-admin-v205.js"></script><script src="install-app-v205.js"></script><script>window.IntervalCosmosCloud.fetchRankings({mode:'TEXT',scope:'hall'});</script></body></html>
