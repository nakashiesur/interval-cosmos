<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outbox regression fixture</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../offline-sync-v205.css">
<body style="padding:24px"><h1>保存・同期の通信断テスト</h1><p>模擬サーバー専用。実DBには接続しません。</p><p id="fixture-state" role="status"></p>
<button id="offline" class="secondary-btn">通信を切る</button><button id="online" class="secondary-btn">通信を戻す</button><button id="lost" class="secondary-btn">次の応答を失う</button><button id="save" class="secondary-btn">テスト結果を保存</button><div class="home-footer"></div>
<script>
window.INTERVAL_COSMOS_CLOUD={supabaseUrl:'https://outbox-fixture.invalid',supabaseAnonKey:'fixture'};
let disconnected=localStorage.getItem('outbox-fixture-offline')==='1',drop=false;
const sessions=JSON.parse(localStorage.getItem('outbox-fixture-sessions')||'{}');
const status=()=>document.querySelector('#fixture-state').textContent=`通信：${disconnected?'切断':'接続'} / サーバー記録：${Object.keys(sessions).length}件`;
window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:{user:{id:'fixture-user'}}}})},rpc:async(name,args)=>{
 if(disconnected)return {error:{message:'Failed to fetch'}};
 if(name==='get_my_player')return {data:{id:'fixture-player',player_name:'通信断テスト',account_type:'student',ranking_visibility:'always_private'}};
 if(name==='submit_saved_play'){
 const id=args.p_payload.clientEventId;if(sessions[id])return {data:{...sessions[id],duplicate:true}};
 sessions[id]={session_id:id,publication_required:false};localStorage.setItem('outbox-fixture-sessions',JSON.stringify(sessions));status();
 if(drop){drop=false;return {error:{message:'Acknowledgement lost'}}}return {data:sessions[id]};}
 throw Error(name);
}})};
</script>
<script src="../offline-outbox-v205.js?v=alpha10.1"></script><script src="../cloud.js?v=alpha10.21"></script><script src="../offline-sync-ui-v205.js?v=alpha10.1"></script>
<script>
const cloud=window.IntervalCosmosCloud;
document.querySelector('#offline').onclick=()=>{disconnected=true;localStorage.setItem('outbox-fixture-offline','1');status()};
document.querySelector('#online').onclick=async()=>{disconnected=false;localStorage.setItem('outbox-fixture-offline','0');await cloud.syncSavedPlays();status()};
document.querySelector('#lost').onclick=()=>{drop=true;document.querySelector('#fixture-state').textContent='次の送信は受信後に応答を失います。'};
document.querySelector('#save').onclick=async()=>{const r=await cloud.submitScore({mode:'TEXT',score:42,totalAnswers:2,correctAnswers:1,maxCombo:1,avgResponse:300});status();document.querySelector('#fixture-state').textContent+=r.queued?' / 端末に保存しました':' / 送信完了'};
cloud.init().then(status).catch(e=>document.querySelector('#fixture-state').textContent=e.message);
</script></body></html>
