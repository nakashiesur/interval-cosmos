<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>PT獲得表示の確認</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app-actions-v205.css"><style>body{display:block;overflow:auto;padding:16px}.result-panel{padding:20px;max-width:650px;margin:20px auto}.mode-card{min-height:140px}.controls{display:flex;gap:8px;flex-wrap:wrap}</style><body><div class="controls"><button data-test="earned">獲得</button><button data-test="conditions_not_met">条件未達</button><button data-test="daily_limit">上限</button><button data-test="burst">実績通知の表示・終了</button></div><button class="mode-card" data-mode="orbitText"><b>TEXT</b><span class="mode-badge">60 SEC</span></button><section class="result-panel" data-reward-event="fixture"><h1>RESULT</h1><div class="result-actions"><button class="primary-btn">RETRY</button><button class="secondary-btn">RANKING</button></div></section><script>
let status='earned';window.IntervalCosmosCloud={getCachedPlayer:()=>({id:'fixture'})};window.IntervalCosmosProgressV205={fetchProgress:async()=>({mode_clear_rewards:[{mode:'TEXT',daily_limit:5,earned_count:status==='daily_limit'?5:1}]})};window.IntervalCosmosSupabaseSingleton={getClient:()=>({rpc:async()=>({data:{points:status==='earned'?20:0,status,remaining:status==='daily_limit'?0:4,min_answers:10,min_accuracy:70}})})};document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{if(b.dataset.test==='burst'){const old=document.querySelector('.v205-unlock-burst');if(old)old.remove();else{const n=document.createElement('div');n.className='v205-unlock-burst';n.textContent='実績通知中';document.body.append(n);}return;}status=b.dataset.test;window.dispatchEvent(new CustomEvent('ic-mode-reward-ready',{detail:{client_event_id:'fixture'}}));});
</script><script src="mode-rewards-ui-v205.js"></script></body></html>
