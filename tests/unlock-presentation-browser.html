<body style="background:#070914;color:white"><h1>称号演出の確認</h1><button id="run">最初の獲得応答を2回返す</button><output id="result">未実行</output>
<script>
let calls=0,shown=[];
const payload={new_achievements:[{id:'first_signal',name:'FIRST SIGNAL',points:10}],new_titles:[{id:'first_signal',name:'FIRST SIGNAL'}]};
window.INTERVAL_COSMOS_CLOUD={supabaseUrl:'local-fixture',supabasePublishableKey:'fixture-only'};

</script><script src="../phase5-progression-v205.js?v=beta.1.1"></script><script src="../phase5-unlock-copy-hotfix-v205.js"></script></body></html>
