name: Apply assignment clarity patch

on:
  push:
    branches: [v2.0.5-dev]
    paths:
      - 'scripts/patch-assignment-clarity-v205.py'
      - '.github/workflows/apply-assignment-clarity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.5-dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-assignment-clarity-v205.py
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase6-assignments-v205.js phase6-game-layout-v205.css index.html sw.js
          git commit -m 'Fix assignment interval clarity and answer feedback'
          git push origin HEAD:v2.0.5-dev
