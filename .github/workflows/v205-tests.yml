name: v2.0.5 regression tests

on:
  push:
    branches: [v2.0.5-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check extension scripts
        run: |
          node --check supabase-singleton-v205.js
          node --check phase2-recovery-v205-fixed.js
          node --check runtime-v205.js
          node --check phase3-ranking-hotfix-v205.js
          node --check phase3-v205.js
          node --check phase4-hotfix-v205.js
          node --check phase4-v205.js
          node --check phase4-analysis-hotfix-v205.js
          node --check phase5-progression-v205.js
          node --check phase5-unlock-copy-hotfix-v205.js
          node --check phase6-admin-policy-v205.js
          node --check phase6-multimode-v205.js
          node --check phase6-assignments-v205.js
          node --check phase7-admin-dashboard-v205.js
          node --check phase7-admin-home-dock-v205.js
          node --check phase8-pc-controls-v205.js
      - name: Existing smoke tests
        run: node tests/smoke-test.js
      - name: Playback regression
        run: node tests/playback-test.js
      - name: Account regression
        run: node tests/account-v205-test.js
      - name: Recovery regression
        run: node tests/recovery-v205-test.js
      - name: Ranking regression
        run: node tests/ranking-v205-test.js
      - name: Learning history regression
        run: node tests/history-v205-test.js
      - name: Progression regression
        run: node tests/progression-v205-test.js
      - name: Assignment regression
        run: node tests/assignments-v205-test.js
      - name: Admin dashboard regression
        run: node tests/admin-dashboard-v205-test.js
      - name: PC controls regression
        run: node tests/pc-controls-v205-test.js
